# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties
ironchest_version=3.0.0
ironcore_version=1.0.0
ironchest_maven_group=com.gathertocraft.ironchest
ironcore_maven_group=com.gathertocraft.ironcore

# Stonecutter uses Groovy DSL here; silence the Kotlin DSL recommendation.
dev.kikugie.stonecutter.hard_mode=true

# Per-version dependency sets (26.1 builds MC 26.1.2).
# Single source of truth for all modules and versions.
mc.26.3.minecraft=26.3
mc.26.3.fabric_api=0.162.0
mc.26.3.neoforge=26.3.0.67-beta
mc.26.3.gson=2.14.0
mc.26.3.constraint=~26.3
mc.26.3.range=[26.3,26.4)
mc.26.3.neoforge_range=[26.3.0.52-beta,)

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties
ironchest_version=3.0.0
ironcore_version=1.0.0
ironchest_maven_group=com.gathertocraft.ironchest
ironcore_maven_group=com.gathertocraft.ironcore

# Stonecutter uses Groovy DSL here; silence the Kotlin DSL recommendation.
dev.kikugie.stonecutter.hard_mode=true

# Per-version dependency sets (26.1 builds MC 26.1.2).
# Single source of truth for all modules and versions.
mc.26.1.minecraft=26.1.2
mc.26.1.fabric_api=0.155.3
mc.26.1.neoforge=26.1.2.116
mc.26.1.gson=2.13.2
mc.26.1.constraint=~26.1
mc.26.1.range=[26.1,26.2)
mc.26.1.neoforge_range=[26.1.2.116,)

mc.26.2.minecraft=26.2
mc.26.2.fabric_api=0.161.0
mc.26.2.neoforge=26.2.0.90
mc.26.2.gson=2.14.0
mc.26.2.constraint=~26.2
mc.26.2.range=[26.2,26.3)
mc.26.2.neoforge_range=[26.2.0.90,)

mc.26.3.minecraft=26.3
mc.26.3.fabric_api=0.162.0
mc.26.3.neoforge=26.3.0.67-beta
mc.26.3.gson=2.14.0
mc.26.3.constraint=~26.3
mc.26.3.range=[26.3,26.4)
mc.26.3.neoforge_range=[26.3.0.52-beta,)

plugins {
  alias(libs.plugins.fabric.loom)
}

version = project.ironchest_version
group = project.ironchest_maven_group

base {
  archivesName = "IronChests"
}

loom {
  splitEnvironmentSourceSets()

  mods {
    "ironchest" {
      sourceSet sourceSets.main
      sourceSet sourceSets.client
    }
  }
}

dependencies {
  minecraft libs.minecraft

  implementation libs.fabric.loader
  implementation libs.fabric.api

  implementation(project(":iron-chests:common"))
  include(project(":iron-chests:common"))
  implementation(project(":iron-core:common"))
  implementation(project(":iron-core:fabric"))
}

sourceSets {
  // Shared mod assets and data; loader-specific files stay in src/main/resources.
  main {
    resources {
      srcDir("../resources")
    }
  }
}

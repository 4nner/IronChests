plugins {
  alias(libs.plugins.fabric.loom)
}

// Stonecutter node id, e.g. `26.1`. Same-version refs only: same-named
// nodes share Gradle module coordinates (common compiles in, see below).
def mcNode = stonecutter.current.project

// project() inside dependencies{} returns a dependency; evaluate it here.
def coreFabricJar = project(":iron-core:fabric:${mcNode}").tasks.named("jar")

version = "${project.ironchest_version}+${mcNode}"
group = project.ironchest_maven_group

base {
  archivesName = "IronChests"
}

loom {
  accessWidenerPath = project(":iron-chests:common").file("src/main/resources/ironchest.accesswidener")
  splitEnvironmentSourceSets()

  mods {
    "ironchest" {
      sourceSet sourceSets.main
      sourceSet sourceSets.client
    }
  }
}

dependencies {
  minecraft "com.mojang:minecraft:${property("mc.${mcNode}.minecraft")}"

  implementation libs.fabric.loader
  implementation "net.fabricmc.fabric-api:fabric-api:${property("mc.${mcNode}.fabric_api")}+${property("mc.${mcNode}.minecraft")}"

  // Core ships as its own mod: file dependency (same reason as above).
  implementation(project(":iron-core:common:${mcNode}"))
  implementation(files(coreFabricJar))
}

sourceSets {
  // Shared mod assets and data; loader-specific files stay in src/main/resources.
  main {
    java {
      // Post-Stonecutter common sources: branch sources skip preprocessing.
      srcDir(file("../../../common/versions/${mcNode}/build/generated/stonecutter/main/java"))
      // Client-only common code (*/client/*) compiles in the client source set.
      exclude("**/client/**")
    }
    resources {
      srcDir("../../../resources")
    }
  }
  client {
    java {
      // Package-rooted: include filters apply per source root, and the
      // default roots have no `client/` segment.
      srcDir(file("../../../common/versions/${mcNode}/build/generated/stonecutter/main/java/com/gathertocraft/ironchest/client"))
    }
  }
}

// The wired common sources come from the same-version common node's generation.
tasks.named("compileJava") {
  dependsOn(":iron-chests:common:${mcNode}:stonecutterGenerate")
}
tasks.named("compileClientJava") {
  dependsOn(":iron-chests:common:${mcNode}:stonecutterGenerate")
}
tasks.named("sourcesJar") {
  dependsOn(":iron-chests:common:${mcNode}:stonecutterGenerate")
}

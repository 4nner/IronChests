plugins {
  alias(libs.plugins.neogradle.moddev)
}

// The ironcore mod mapping in neoForge.mods below reads other projects'
// source sets; force them to evaluate first (settings order alone,
// plus Loom's eager handling of `include`, doesn't guarantee it).
evaluationDependsOn(":iron-core:neoforge")
evaluationDependsOn(":iron-core:common")

version = project.ironchest_version
group = project.ironchest_maven_group

base {
  archivesName = "IronChests-neoforge"
}

neoForge {
  version = libs.versions.neoforge.get()

  // Fail the build on invalid AT targets instead of silently ignoring them.
  validateAccessTransformers = true

  mods {
    ironchest {
      sourceSet sourceSets.main
      // Common classes load as part of this mod in dev runs.
      sourceSet project(":iron-chests:common").sourceSets.main
    }
    // Core ships as a separate mod; its content must be mapped here too:
    // runs only load mods declared in the run-owning project.
    ironcore {
      sourceSet project(":iron-core:neoforge").sourceSets.main
      sourceSet project(":iron-core:common").sourceSets.main
    }
  }

  runs {
    client {
      client()
    }
    server {
      server()
    }
  }
}

repositories {
  maven {
    name = "NeoForge"
    url = "https://maven.neoforged.net/releases/"
  }
}

dependencies {
  implementation libs.neoforge

  // Compile against common; its classes are inlined into this jar below.
  implementation(project(":iron-chests:common"))
  // Core ships as its own mod: compile against its common classes, depend on
  // its loader artifact for dev runs, nest nothing.
  implementation(project(":iron-core:common"))
  implementation(project(":iron-core:neoforge"))
}

// Fat-jar common classes: nested Jar-in-Jar jars load as plugin-layer
// libraries, which cannot reference Minecraft code.
tasks.named("jar") {
  from(project(":iron-chests:common").sourceSets.main.output.classesDirs)
  duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}

sourceSets {
  // Shared mod assets and data; loader-specific files stay in src/main/resources.
  main {
    resources {
      srcDir("../resources")
    }
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
  }
}

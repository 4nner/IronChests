plugins {
  alias(libs.plugins.neogradle.moddev)
}

// Stonecutter node id, e.g. `26.1`. Same-version refs only: same-named
// nodes share Gradle module coordinates (common compiles in, see below).
def mcNode = stonecutter.current.project

// project() inside dependencies{} returns a dependency; evaluate it here.
def coreNeoForgeJar = project(":iron-core:neoforge:${mcNode}").tasks.named("jar")

// The ironcore mod mapping in neoForge.mods below reads other projects'
// source sets; force them to evaluate first.
evaluationDependsOn(":iron-core:neoforge:${mcNode}")
evaluationDependsOn(":iron-core:common:${mcNode}")

version = "${project.ironchest_version}+${mcNode}"
group = project.ironchest_maven_group

base {
  archivesName = "IronChests-neoforge"
}

neoForge {
  version = property("mc.${mcNode}.neoforge")

  // Fail the build on invalid AT targets instead of silently ignoring them.
  validateAccessTransformers = true

  mods {
    ironchest {
      sourceSet sourceSets.main
    }
    // Core ships as a separate mod; its content must be mapped here too:
    // runs only load mods declared in the run-owning project.
    ironcore {
      sourceSet project(":iron-core:neoforge:${mcNode}").sourceSets.main
      sourceSet project(":iron-core:common:${mcNode}").sourceSets.main
    }
  }

  runs {
    client {
      client()
    }
    server {
      server()
    }
  }
}

repositories {
  maven {
    name = "NeoForge"
    url = "https://maven.neoforged.net/releases/"
  }
}

dependencies {
  implementation "net.neoforged:neoforge:${property("mc.${mcNode}.neoforge")}"

  // Core ships as its own mod: file dependency (same reason as above).
  implementation(project(":iron-core:common:${mcNode}"))
  implementation(files(coreNeoForgeJar))
}

sourceSets {
  // Shared mod assets and data; loader-specific files stay in src/main/resources.
  // Common sources compile in, so no fat-jarring (nested jars can't use
  // Minecraft code).
  main {
    // Post-Stonecutter common sources: branch sources skip preprocessing.
    java.srcDir(file("../../../common/versions/${mcNode}/build/generated/stonecutter/main/java"))
    resources {
      srcDir("../../../resources")
    }
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
  }
}

// Stonecutter generates the versioned sources ModDevGradle's artifact
// creation reads; order the two explicitly.
tasks.named("createMinecraftArtifacts") {
  dependsOn("stonecutterGenerate")
}

// The wired common sources come from the same-version common node's generation.
tasks.named("compileJava") {
  dependsOn(":iron-chests:common:${mcNode}:stonecutterGenerate")
}
tasks.named("sourcesJar") {
  dependsOn(":iron-chests:common:${mcNode}:stonecutterGenerate")
}

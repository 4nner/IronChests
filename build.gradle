// Build logic shared by every module. Anything loader or module-specific
// stays in the module build files.

// Single definition of the Java toolchain: `release` implies source/target
// compatibility. Loader-specific bits (e.g. NeoForge's toolchain block)
// stay in the module files.
subprojects {
  plugins.withId("java") {
    java {
      // Loom attaches the sources jar to its RemapSourcesJar task and to the "build" task
      // if it is present.
      withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
      it.options.release = libs.versions.java.get().toInteger()
    }

    // Every jar ships the license. The provider is captured at configuration time so the
    // execution-time rename closure never touches Task.project.
    tasks.named("jar").configure {
      def licenseFile = rootProject.file("LICENSE")
      def archivesName = project.base.archivesName
      from(licenseFile) {
        rename { "LICENSE_" + archivesName.get() }
      }
    }
  }

  // Version expansion for loader metadata. afterEvaluate: modules assign
  // `version` in their own scripts, so it must be read late.
  // NOTE: match Loom by its short plugin id.
  plugins.withId("fabric-loom") {
    project.afterEvaluate {
      tasks.named("processResources").configure {
        def version = project.version
        def ironcoreVersion = project.property("ironcore_version")
        inputs.property "version", version
        inputs.property "ironcore_version", ironcoreVersion

        filesMatching("fabric.mod.json") {
          expand "version": version, "ironcore_version": ironcoreVersion
        }
      }
    }
  }
  plugins.withId("net.neoforged.moddev") {
    project.afterEvaluate {
      tasks.named("processResources").configure {
        def version = project.version
        def ironcoreVersion = project.property("ironcore_version")
        inputs.property "version", version
        inputs.property "ironcore_version", ironcoreVersion

        filesMatching("META-INF/neoforge.mods.toml") {
          expand "ironchest_version": version, "ironcore_version": ironcoreVersion
        }
      }
    }
  }
}

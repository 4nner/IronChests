plugins {
  id "dev.kikugie.stonecutter"
}

stonecutter {
  parameters {
    // PoseStack.rotateDegrees was added in 26.3; older versions spell it via Axis.
    // (The replacement target must not occur in authored sources, or switching
    // the active version cannot restore them exactly.)
    replacements.string(current.parsed.matches('<26.3')) {
      replace('.rotateDegrees(Axis.YP, rotation)', '.mulPose(Axis.YP.rotationDegrees(rotation))')
    }
  }
}

def isCi = System.getenv('CI') == 'true'
if (isCi) stonecutter.active null
else stonecutter.active '26.3' /* [SC] DO NOT EDIT */

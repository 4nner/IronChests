plugins {
  alias(libs.plugins.neogradle.moddev)
  id 'maven-publish'
}

version = project.mod_version
group = project.core_maven_group

base {
  archivesName = "IronCore-neoforge"
}

neoForge {
  version = libs.versions.neoforge.get()
}

repositories {
  maven {
    name = "NeoForge"
    url = "https://maven.neoforged.net/releases/"
  }
}

dependencies {
  implementation libs.neoforge

  // implementation: compile against common; jarJar: nest common into the mod jar.
  implementation(project(":iron-core:common"))
  jarJar(project(":iron-core:common"))
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
  }
}

// configure the maven publication
publishing {
  publications {
    create("mavenJava", MavenPublication) {
      from components.java
    }
  }

  // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
  repositories {
    // Add repositories to publish to here.
    // Notice: This block does NOT have the same function as the block in the top level.
    // The repositories here will be used for publishing your artifact, not for
    // retrieving dependencies.
  }
}

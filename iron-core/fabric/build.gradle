plugins {
  alias(libs.plugins.fabric.loom)
}

// Stonecutter node id, e.g. `26.1` (common sources compile in, see below).
def mcNode = stonecutter.current.project

version = "${project.ironcore_version}+${mcNode}"
group = project.ironcore_maven_group

base {
  archivesName = "IronCore"
}

loom {
  accessWidenerPath = project(":iron-core:common").file("src/main/resources/ironcore.accesswidener")
  splitEnvironmentSourceSets()

  mods {
    "ironcore" {
      sourceSet sourceSets.main
      sourceSet sourceSets.client
    }
  }
}

dependencies {
  minecraft "com.mojang:minecraft:${property("mc.${mcNode}.minecraft")}"

  implementation libs.fabric.loader
  implementation "net.fabricmc.fabric-api:fabric-api:${property("mc.${mcNode}.fabric_api")}+${property("mc.${mcNode}.minecraft")}"
}

sourceSets {
  // Shared mod assets and data; loader-specific files stay in src/main/resources.
  main {
    java {
      // Post-Stonecutter common sources: branch sources skip preprocessing.
      srcDir(file("../../../common/versions/${mcNode}/build/generated/stonecutter/main/java"))
      // Client-only common code (*/client/*) compiles in the client source set.
      exclude("**/client/**")
    }
    resources {
      srcDir("../../../resources")
    }
  }
  client {
    java {
      // Package-rooted: include filters apply per source root, and the
      // default roots have no `client/` segment.
      srcDir(file("../../../common/versions/${mcNode}/build/generated/stonecutter/main/java/com/gathertocraft/ironcore/client"))
    }
  }
}

// The wired common sources come from the same-version common node's generation.
tasks.named("compileJava") {
  dependsOn(":iron-core:common:${mcNode}:stonecutterGenerate")
}
tasks.named("compileClientJava") {
  dependsOn(":iron-core:common:${mcNode}:stonecutterGenerate")
}
tasks.named("sourcesJar") {
  dependsOn(":iron-core:common:${mcNode}:stonecutterGenerate")
}
